server:
  port: 8080

spring:
  application:
    name: issueflow
  jackson:
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: jdbc:h2:mem:db;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driverClassName: org.h2.Driver
  sql:
    init:
      platform: mssql
  h2:
    console:
      enabled: true
  jpa:
    database: POSTGRESQL
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

issueflow:
  jwt:
    secret: issueflow-test-secret-for-integration-tests
    expires-in-seconds: 3600
